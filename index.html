<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underworld · Verse 2 · Aurora Lyrics</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600&display=swap">
</head>
<body>

  <canvas id="aurora"></canvas>
  <div id="prog"><div id="progFill"></div></div>

  <main id="stage">
    <h1 id="lyric" aria-live="polite"></h1>
  </main>

  <div id="caption"></div>

  <div id="cover">
    <h1>Underworld</h1>
    <p>Verse two, animated over an aurora.</p>
    <button id="startBtn">Play</button>
    <div class="meta" id="coverMeta"></div>
    <div class="meta hint" id="coverHint"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
